name: Publish verified WayVR XS release

on:
  push:
    branches: [release/xs-v0.1.1]
    paths:
      - .github/workflows/publish-xs-release.yml
      - docs/RELEASE-NOTES-XS-0.1.1.md

permissions:
  contents: read

concurrency:
  group: publish-xs-v0.1.1
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'Chineko/wayvr_xs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: a24ca4257ca202578d28ece66ae84eaa0268be48
      SOURCE_RUN: '39586803656'
      RELEASE_TAG: xs-v0.1.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for verified Arch publication
        run: gh run watch "$SOURCE_RUN" --exit-status --interval 30
      - name: Verify successful source build
        run: |
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          python3 - <<'PY'
          import json, os
          with open('run.json') as file:
              run = json.load(file)
          assert run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_COMMIT']
          assert run['head_branch'] == 'feat/xs-ultrawide-panels'
          assert run['path'] == '.github/workflows/build-arch.yml'
          PY
      - name: Download and verify tested package
        run: |
          gh run download "$SOURCE_RUN" --name wayvr-xs-arch-x86_64 --dir package
          cd package
          test "$(cat SOURCE-COMMIT.txt)" = "$SOURCE_COMMIT"
          sha256sum -c SHA256SUMS
          test -f wayvr-xs-git-26.8.0.r1724.ga24ca425-1-x86_64.pkg.tar.zst
          # Snapshot checksum covers the files attached to this release only.
          sha256sum wayvr-xs-git-26.8.0.r1724.ga24ca425-1-x86_64.pkg.tar.zst SOURCE-COMMIT.txt > SHA256SUMS
      - name: Publish versioned snapshot
        run: |
          # Resume only this exact verified snapshot if publication is retried.
          # xs-v tags deliberately avoid the upstream v** AppImage workflow.
          if gh release view "$RELEASE_TAG" --json targetCommitish > existing.json 2>/dev/null; then
            test "$(jq -r .targetCommitish existing.json)" = "$SOURCE_COMMIT"
          else
            gh release create "$RELEASE_TAG" \
            --target "$SOURCE_COMMIT" --draft \
            --title 'WayVR XS 0.1.1' \
            --notes-file docs/RELEASE-NOTES-XS-0.1.1.md
          fi
          gh release upload "$RELEASE_TAG" \
            package/wayvr-xs-git-26.8.0.r1724.ga24ca425-1-x86_64.pkg.tar.zst \
            package/SHA256SUMS package/SOURCE-COMMIT.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
